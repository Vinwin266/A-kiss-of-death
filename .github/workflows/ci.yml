name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile the package
        run: python -m compileall -q meterline

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

      - name: Install the package
        run: python -m pip install --disable-pip-version-check .

      - name: Check the console script is wired up
        run: meterline version

  determinism:
    name: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The datasets validate
        run: |
          python -m meterline validate --dataset examples/riverside.json
          python -m meterline validate --dataset examples/tiny.json

      - name: A run replays to the same bytes
        run: |
          python -m meterline replay --dataset examples/riverside.json --passes 3
          python -m meterline replay --dataset examples/tiny.json --passes 3

      - name: The same comparison twice is byte-identical
        run: |
          python -m meterline compare --dataset examples/riverside.json \
            --against legacy-cooperative --out /tmp/first.txt
          python -m meterline compare --dataset examples/riverside.json \
            --against legacy-cooperative --out /tmp/second.txt
          diff /tmp/first.txt /tmp/second.txt

      - name: Every preset rates the examples without error
        run: |
          for profile in model-rules legacy-cooperative strict-municipal permissive-retailer; do
            python -m meterline rate --dataset examples/tiny.json \
              --profile "$profile" --format json > /dev/null
          done

      - name: A dataset survives export and re-import
        run: |
          python -m meterline export --dataset examples/riverside.json --out /tmp/exported.json
          python -m meterline validate --dataset /tmp/exported.json

      - name: The suite is green three times running
        run: |
          for attempt in 1 2 3; do
            python -m unittest discover -s tests -t .
          done

      - name: The checked-in examples are the ones the generator produces
        run: |
          python tools/make_examples.py
          git diff --exit-code -- examples/
